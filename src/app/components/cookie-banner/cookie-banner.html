@if (visible) {
  <div class="cookie-banner" role="dialog" aria-label="Preferências de cookies">
    <div class="cookie-content">
      <div class="cookie-icon">
        <mat-icon>cookie</mat-icon>
      </div>
      <div class="cookie-text">
        <h3>Cookies e Privacidade</h3>
        <p>
          Usamos cookies analíticos para melhorar o website. <br />
          <a routerLink="/politica-privacidade" (click)="visible = false">Política de Privacidade</a
          >.
        </p>
      </div>
      <div class="cookie-actions">
        <button mat-stroked-button class="btn-reject" (click)="rejectOptional()">
          Apenas necessários
        </button>
        <button mat-flat-button class="btn-accept" (click)="acceptAll()">Aceitar todos</button>
      </div>
    </div>
  </div>
}
