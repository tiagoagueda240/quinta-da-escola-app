<div class="login-wrapper">
    <div class="login-card">
        <h1>Nova Senha</h1>

        <div *ngIf="tokenValido; else invalido">
            <mat-form-field appearance="outline" style="width: 100%; margin-top: 20px;">
                <mat-label>Nova Password</mat-label>
                <input matInput type="password" [(ngModel)]="password">
            </mat-form-field>

            <button mat-flat-button color="primary" (click)="alterar()" [disabled]="loading || !password"
                style="width: 100%;">
                Alterar Senha
            </button>
        </div>

        <ng-template #invalido>
            <p style="color: red">Token inválido ou em falta na URL.</p>
            <a href="/login" mat-button>Voltar ao Login</a>
        </ng-template>

    </div>
</div>
