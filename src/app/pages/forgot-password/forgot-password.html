<div class="login-wrapper">
    <div class="login-card">
        <h1>Recuperar Conta</h1>
        <p>Insira o seu email para receber o link.</p>

        <mat-form-field appearance="outline" style="width: 100%; margin-top: 20px;">
            <mat-label>Email</mat-label>
            <input matInput [(ngModel)]="email" placeholder="admin@...">
        </mat-form-field>

        <button mat-flat-button color="primary" (click)="enviar()" [disabled]="loading || !email" style="width: 100%;">
            {{ loading ? 'A enviar...' : 'Enviar Link' }}
        </button>

        <p style="margin-top: 15px; font-size: 0.8rem;">
            <a href="/login">Voltar ao Login</a>
        </p>
    </div>
</div>
